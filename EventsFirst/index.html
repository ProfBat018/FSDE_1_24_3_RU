<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/style.css" rel="stylesheet">
    <link href="./src/output.css" rel="stylesheet">
    <script defer src="./script.js"></script>
    <title>Login&Regstration Form</title>
</head>

<body>

    <body class="flex items-center justify-center min-h-screen bg-gray-100">

        <h1 id="test">test1</h1>
        <h1 id="test">test2</h1>
        <div class=" w-full max-w-md bg-white rounded-2xl shadow-lg overflow-hidden">

            <div class="flex justify-between">
                <button id="loginTab"
                    class="w-1/2 py-3 text-center font-semibold text-white bg-blue-500 transition-colors duration-300 hover:bg-blue-600">
                    Login
                </button>
                <button id="registerTab"
                    class="w-1/2 py-3 text-center font-semibold text-blue-500 bg-gray-100 transition-colors duration-300 hover:bg-blue-200">
                    Register
                </button>
            </div>


            <div class="relative w-[200%] slider flex" id="formSlider">

                <div class="w-1/2 p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Welcome Back</h2>
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600">Username</label>
                            <input id="usernameInput" required type="text"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                                placeholder="Enter your username">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600">Password</label>
                            <input id="passwordInput" required type="password"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                                placeholder="Enter your password">
                        </div>
                        <button type="submit"
                            class="w-full py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600">Login</button>
                    </form>
                </div>


                <div class="w-1/2 p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Create Account</h2>
                    <form id="registerForm" class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600">Username</label>
                            <input required type="text"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                                placeholder="Choose a username">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600">Email</label>
                            <input required type="email"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                                placeholder="Enter your email">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600">Password</label>
                            <input required type="password"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                                placeholder="Choose a password">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600"> Confirm Password</label>
                            <input required type="password"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                                placeholder="Confirm your password">
                        </div>
                        <button type="submit"
                            class="w-full py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600">Register</button>
                    </form>
                </div>
            </div>
        </div>

        <script type="script" src="./script.js"></script>
    </body>

</html>
